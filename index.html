<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>手羽先センセーション アルバム選択</title></head>
<body><h1>手羽先センセーション アルバム選択</h1><div id="app"></div>
<button onclick="showResult()">選択内容表示</button><pre id="result"></pre>
<script>
let albums=[];
fetch('data.json').then(r=>r.json()).then(d=>{
albums=d; let app=document.getElementById('app');
albums.forEach((a,i)=>{let c=document.createElement('div');c.innerHTML='<h2>'+a.title+'</h2>';
a.songs.forEach((s,j)=>c.innerHTML+=`<label><input type="checkbox" data-a="${i}" data-s="${j}">${s}</label><br>`);
app.appendChild(c);});
});
function showResult(){let t='';document.querySelectorAll('input:checked').forEach((x,i)=>{let a=albums[x.dataset.a];t+=(i+1)+'. '+a.songs[x.dataset.s]+' / '+a.title+'\n'});document.getElementById('result').textContent=t;}
</script></body></html>
